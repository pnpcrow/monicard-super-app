name: monicard_super_app
description: MoniCard companion for Android and Web
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  file_picker: ^10.3.2
  image: ^4.5.4
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1
  provider: ^6.1.5
  web: ^1.1.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tags/tags_master.json
    - assets/brand/
